owner: wearecordice
repo: status

# Every address a user or a client actually depends on, checked from outside.
#
# The point of this repository is that none of it runs on our infrastructure:
# the checks run on GitHub's machines and the page is served by GitHub Pages, so
# a total outage of our server still leaves a working page saying so. A status
# page hosted next to the thing it watches goes quiet exactly when it matters.
#
# Two rules for everything below.
#
# Every entry carries maxResponseTime. Upptime's default is sixty seconds,
# which is not a threshold so much as the absence of one: nothing this stack
# serves takes a minute, so "degraded" could never be reached and the page had
# only two states where it draws three. These services answer in 100–550ms, so
# three seconds is slow enough to be real trouble and far enough above normal
# not to cry wolf.
#
# Where a service returns something only it would say, the check asserts on
# that text rather than on the status code alone. A 200 proves something
# answered, not that the right thing answered.
#
# Each entry also carries an icon of our own. Without one Upptime asks
# icons.duckduckgo.com for a favicon, which means every reader's browser tells
# DuckDuckGo they are looking at whether Cordice is down — on a site that
# self-hosts its fonts precisely so no third party learns who reads it. The
# page never shows them; they are set to stop the request.
sites:
  - name: Web client
    url: https://app.cordice.org/
    icon: https://cordice.org/mark.svg
    maxResponseTime: 3000

  - name: API
    url: https://app.cordice.org/api/
    icon: https://cordice.org/mark.svg
    maxResponseTime: 3000
    # The discovery document. It touches configuration, the database and the
    # file service's address, so a 200 here means rather more than a static page.
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: features

  - name: Events
    url: https://app.cordice.org/ws/health
    icon: https://cordice.org/mark.svg
    maxResponseTime: 3000
    # Not the socket itself: a WebSocket handshake cannot be made over HTTP/2,
    # which is what this monitor speaks, and the proxy would answer 502 — the
    # same 502 a dead service returns. So the service answers this path itself,
    # with a body no other part of the stack would produce.
    __dangerous__body_down_if_text_missing: ok

  - name: Voice
    # The room server. Its root answers "OK" while it is running, and Caddy
    # returns 502 when it is not, so the two states cannot be confused.
    #
    # This is the one service the front page advertises by name and the status
    # page said nothing about — someone whose call had just dropped could read
    # "all systems operational" and be told a lie by omission.
    url: https://app.cordice.org/livekit/
    icon: https://cordice.org/mark.svg
    maxResponseTime: 3000

  - name: File service
    url: https://app.cordice.org/autumn/
    icon: https://cordice.org/mark.svg
    maxResponseTime: 3000
    __dangerous__body_down_if_text_missing: file server

  - name: Link previews
    # What turns a pasted link into a card. Its absence is the kind of fault
    # people report as "the app is broken" without being able to say how.
    url: https://app.cordice.org/january/
    icon: https://cordice.org/mark.svg
    maxResponseTime: 3000
    __dangerous__body_down_if_text_missing: media proxy

  - name: GIF search
    url: https://app.cordice.org/gifbox/
    icon: https://cordice.org/mark.svg
    maxResponseTime: 3000
    __dangerous__body_down_if_text_missing: Gifbox

  - name: Mail
    # Our own server, and the reason a password reset or a report of abuse
    # arrives at all. There is no page to fetch, so this opens the submission
    # port and no more: an implicit-TLS connection answering is what a sending
    # or collecting client needs to find.
    check: tcp-ping
    url: mail.cordice.org
    port: 465
    icon: https://cordice.org/mark.svg
    maxResponseTime: 3000

  - name: Website
    url: https://cordice.org/
    icon: https://cordice.org/mark.svg
    maxResponseTime: 3000

  - name: Developer documentation
    url: https://developers.cordice.org/
    icon: https://cordice.org/mark.svg
    maxResponseTime: 3000

status-website:
  cname: status.cordice.org
  name: Cordice Status
  theme: dark

  # The mark on its own, not the favicon. The favicon is the cube on its violet
  # square, and a square logo dropped inside the navigation reads as a logo
  # drawn twice — the site had the same fault and lost it.
  logoUrl: https://cordice.org/mark.svg
  faviconSvg: https://cordice.org/favicon.svg

  introTitle: "Whether Cordice is working, checked from outside our own infrastructure."
  introMessage: >-
    Every service is probed every five minutes from GitHub's machines, and this
    page is served by GitHub — so if our servers go down, this page stays up and
    says so. History and incidents are public.

  navbar:
    - title: Status
      href: /
    - title: Cordice
      href: https://cordice.org
    - title: Developers
      href: https://developers.cordice.org
    - title: Source
      href: https://github.com/wearecordice/status

  # The theme, and the only copy of it.
  #
  # It used to live here and in assets/cordice.css both, with a note asking
  # whoever edited one to remember the other. That is a rule nobody keeps, so
  # the file is gone and this is the original.
  #
  # It cannot become a themeUrl on our own host: the site generator crawls that
  # path as though it were a page, creates a directory where the stylesheet was
  # going to be written, and the build fails.
  #
  # The values are cordice.org's own — see apps/site/src/styles/tokens.css in
  # the monorepo. That palette follows Material Design 3, where a raised
  # surface is a lighter tone rather than a shadow or an outline, so most of
  # what this file does is switch Upptime's borders off and let tone do the
  # separating.
  css: |
    /* Inter, from our own host. The status page is served by GitHub and the
       font by Cloudflare, which makes it a cross-origin request — hence the
       Access-Control-Allow-Origin on /fonts/* in apps/site/public/_headers.
       Without both halves the page silently falls back to Roboto, which is
       what it wore before and the plainest sign that it was not ours. */
    @font-face {
      font-family: "InterVariable";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("https://cordice.org/fonts/InterVariable.woff2") format("woff2");
    }

    :root {
      /* Surfaces, darkest first. Every step is a tone; nothing is outlined. */
      --body-background-color: #121218;
      --body-text-color: #e4e1e9;
      --card-background-color: #1e1e26;
      --nav-background-color: #121218;

      /* Switched off rather than coloured. Upptime draws a rule under the
         navigation, a border around every card and a bar down the left of
         each one to carry its state; the design these pages belong to has no
         outlines at all, so the state is redrawn below as a filled dot. */
      --nav-border-bottom-color: transparent;
      --nav-current-border-bottom-color: transparent;
      --card-border-color: transparent;
      --up-border-left-color: transparent;
      --degraded-border-left-color: transparent;
      --down-border-left-color: transparent;

      /* A service that is down tints its own surface. Kept well short of a
         full error colour: the page is read at a glance and the row that is
         wrong should stand out without the eye being shouted at. */
      --down-background-color: #2a1a1f;

      /* Up, degraded and down stay green, amber and red. The accent is violet
         now and would not be confused with any of them, but these three are
         the set every reader already knows, and a status page is the last
         place to be original about that. Text on them is dark, because each
         is a light tone. */
      --tag-color: #121218;
      --tag-up-background-color: #7ddba4;
      --tag-degraded-background-color: #ffb787;
      --tag-down-background-color: #ffb4ab;
      --change-background-color: #ffb787;

      /* Buttons take the brand, lightened until dark text on them is legible,
         exactly as on the site. */
      --error-button-border-color: #c3c4ff;
      --error-button-background-color: #c3c4ff;
      --error-button-color: #2b2e7b;
      --submit-button-border-color: #c3c4ff;
      --submit-button-background-color: #c3c4ff;
      --submit-button-color: #2b2e7b;

      /* The response-time graph sits behind each card. Faint, because it is
         texture and not the reading. */
      --graph-opacity: 0.32;
    }

    body {
      font-family: "InterVariable", "Inter", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* One measure for the navigation and the page, so the two line up. */
    .container {
      max-width: 900px;
    }

    /* Navigation. The site's rule about shape: anything you press is fully
       rounded, anything you read off is a rounded rectangle.
     *
     * Every selector below carries [class]. Upptime's own rules are written by
     * Svelte and come out as a.svelte-ngkazm, which outranks a plain
     * `nav ul li a` — so the first version of this file set a padding that
     * never applied and left a 74px bar of pills nearly as tall as it. The
     * attribute selector matches the same elements and outranks the hash
     * without depending on it, since the hash changes whenever upstream
     * touches that component. */
    nav {
      padding-block: 0;
    }

    nav ul li a[class] {
      border-radius: 999px;
      padding: 7px 14px;
      color: #c7c5d0;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.2;
      transition: background 200ms cubic-bezier(0.2, 0, 0, 1), color 200ms cubic-bezier(0.2, 0, 0, 1);
    }

    nav ul li a[class]:hover {
      background: #1e1e26;
      color: #e4e1e9;
    }

    /* The page you are on is marked, not highlighted. A filled pill at full
       strength reads as the thing to press, and the thing to press is one of
       the other three. */
    nav ul li a[aria-current="page"][class] {
      background: #1e1e26;
      color: #e4e1e9;
    }

    /* The mark beside the word, at the weight the site sets it. */
    .logo[class] {
      padding-block: 12px;
      gap: 8px;
    }

    .logo img[class] {
      width: 24px;
      height: 24px;
    }

    .logo div {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.01em;
      color: #e4e1e9;
    }

    h1, h2, h3, h4 {
      letter-spacing: -0.02em;
    }

    /* The intro is the first thing read and the only place the page explains
       itself, so it is given the room to be read rather than skimmed past. */
    .intro {
      max-width: 62ch;
      line-height: 1.6;
    }

    .intro h1 {
      letter-spacing: -0.03em;
      line-height: 1.05;
    }

    a {
      color: #c3c4ff;
    }

    /* Cards: a tone and a radius, and nothing drawn around them. */
    .card,
    .live-status article {
      border-radius: 16px;
      border: none;
    }

    .live-status article[class] {
      padding: 16px 20px;
      /* The response-time graph is a background image on the card itself, and
         Upptime's --graph-opacity is wired to a child element that does not
         exist here, so it does nothing. Blending it into the card's own tone
         is what actually quietens it: the mint fill was taking half of every
         row and reading as content rather than as texture. */
      background-blend-mode: soft-light;
      background-size: auto 62%;
    }

    /* State, said with a filled dot rather than the bar down the left that was
       switched off above. It sits against the service's name, which is where
       the eye lands first. */
    .live-status article h4[class],
    .live-status article h4 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .live-status article h4::before {
      content: "";
      flex: none;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #918f9a;
    }

    .live-status article.up h4::before {
      background: #7ddba4;
    }

    .live-status article.degraded h4::before {
      background: #ffb787;
    }

    .live-status article.down h4::before {
      background: #ffb4ab;
    }

    /* The per-service favicons are set in this file only to keep the browser
       from asking a third party for one. They are all the same mark, so six of
       them down a list is noise rather than information. */
    .live-status article h4 img.icon {
      display: none;
    }

    .live-status article h4 a {
      color: #e4e1e9;
      font-weight: 650;
    }

    .live-status article div {
      color: #c7c5d0;
      font-size: 15px;
    }

    .live-status article .data {
      color: #e4e1e9;
      font-variant-numeric: tabular-nums;
    }

    /* Incidents. Now that they are written by hand as well as opened by the
       monitor, they are worth reading rather than counting: the title carries
       the weight and the line under it is the summary, which is the shape the
       rest of the site sets for a list of things to read. */
    .incidents li[class],
    .incidents article[class] {
      border-radius: 16px;
      border: none;
    }

    .incidents h3[class],
    .incidents h4[class] {
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    /* The tag that carries an incident's severity. Filled, because it is the
       one thing on the row that has to be read before the words. */
    .tag[class] {
      border-radius: 999px;
      padding: 3px 10px;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0;
    }
