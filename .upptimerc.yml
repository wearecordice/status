owner: wearecordice
repo: status

# Every address a user or a client depends on, checked from outside our infrastructure.
#
# The public status page is Phare's, on status.cordice.org (11 November 2026). This repository keeps
# checking from GitHub's machines and keeps the history — a second, independent record — but its own
# site is hidden: no cname, GitHub Pages off. To bring it back as the public page: put
# `cname: status.cordice.org` under status-website, turn Pages on, point the DNS record back.
#
# One model of components for every monitor. The server checks each of its dependencies for real
# (with its own credentials, which never leave it) and answers GET /healthz/<component> with 200
# or 503 — see server/crates/cordice-api/src/health.rs in the monorepo. This page and the alerting
# monitors (Phare) watch the same addresses, so what readers see and what pages us agree.
#
# Adding a component: a check in health.rs, an entry below (and the same in Phare). Names here are
# what readers see: say what a person uses, never which provider is behind it.
#
# Rules for every entry:
# - maxResponseTime 3000. Upptime's default is a minute, which means "degraded" could never be
#   reached; these answer in 100-600 ms, so three seconds is real trouble.
# - assert on text only the right service would answer. A 200 proves something answered, not that
#   the right thing did (a Cloudflare error page is also a page).
# - an icon of our own: without one Upptime asks icons.duckduckgo.com for a favicon, telling a third
#   party who reads this page. The page hides them.
sites:
  - name: Web app
    url: https://app.cordice.org/
    icon: https://cordice.org/mark.svg
    maxResponseTime: 3000
    __dangerous__body_down_if_text_missing: "<title>Cordice</title>"

  - name: API
    # Readiness: the database answers and the encryption keys are available.
    url: https://api.cordice.org/readyz
    icon: https://cordice.org/mark.svg
    maxResponseTime: 3000
    __dangerous__body_down_if_text_missing: ready

  - name: Messages in real time
    # The gateway's own host. Not the socket: a WebSocket handshake cannot be made by this monitor,
    # so the gateway answers this path itself.
    url: https://gw.cordice.org/healthz
    icon: https://cordice.org/mark.svg
    maxResponseTime: 3000
    __dangerous__body_down_if_text_missing: ok

  - name: Voice and video calls
    # The call server's API, reached by our server with its own keys (ListRooms).
    url: https://api.cordice.org/healthz/calls
    icon: https://cordice.org/mark.svg
    maxResponseTime: 3000
    __dangerous__body_down_if_text_missing: operational

  - name: Files and media
    # Uploads and downloads: the user-file bucket, reached by our server with its keys.
    url: https://api.cordice.org/healthz/storage
    icon: https://cordice.org/mark.svg
    maxResponseTime: 3000
    __dangerous__body_down_if_text_missing: operational

  - name: Sign-in codes by email
    # Whether a code can leave right now: the server connects to the mail relay and is greeted.
    url: https://api.cordice.org/healthz/email
    icon: https://cordice.org/mark.svg
    maxResponseTime: 3000
    __dangerous__body_down_if_text_missing: operational

  # The GIF catalog (Gifoteka) is our own service, but it is not running yet: it launches with its
  # own domain and its legal pages (deploy/gifcat/README.md in the monorepo). Uncomment then —
  # until it runs, a red row would say «broken» about something that was never switched on.
  # - name: GIF search
  #   url: https://api.cordice.org/healthz/gifs
  #   icon: https://cordice.org/mark.svg
  #   maxResponseTime: 3000
  #   __dangerous__body_down_if_text_missing: operational

  - name: Short links
    # crdc.xyz: links to people, chats and invites. The root goes to the website.
    url: https://crdc.xyz/
    icon: https://cordice.org/mark.svg
    maxResponseTime: 3000
    __dangerous__body_down_if_text_missing: Cordice

  - name: Website
    url: https://cordice.org/
    icon: https://cordice.org/mark.svg
    maxResponseTime: 3000

  - name: Developer documentation
    url: https://developers.cordice.org/
    icon: https://cordice.org/mark.svg
    maxResponseTime: 3000

status-website:
  # No cname: the public page is Phare's (see the top of this file).
  name: Cordice Status
  theme: dark

  # The mark on its own, not the favicon (a square logo inside the navigation reads as drawn twice).
  logoUrl: https://cordice.org/mark.svg
  faviconSvg: https://cordice.org/favicon.svg

  introTitle: "Cordice status"
  introMessage: >-
    Checked every five minutes from outside our own servers, so this page stays up and says so
    even when we are down. Incidents and their history are public.

  navbar:
    - title: Status
      href: /
    - title: Cordice
      href: https://cordice.org
    - title: Developers
      href: https://developers.cordice.org
    - title: Source
      href: https://github.com/wearecordice/status

  # The look follows the status pages people already know (Discord's, Stoat's): one filled banner
  # with the overall state, then one panel listing the components — the name with a dot, the numbers,
  # and the state in words on the right — then incidents. Tones, font and accent are cordice.org's
  # own (Inter from our host; Material 3 tones, no outlines).
  #
  # The only copy of the theme. It cannot be a themeUrl on our host: the site generator crawls that
  # path as a page and the build fails.
  css: |
    /* Inter, from our own host (cross-origin: Access-Control-Allow-Origin on /fonts/* at cordice.org). */
    @font-face {
      font-family: "InterVariable";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("https://cordice.org/fonts/InterVariable.woff2") format("woff2");
    }

    :root {
      /* cordice.org's own tones (Material 3: a raised surface is a lighter tone, not an outline). */
      --body-background-color: #121218;
      --body-text-color: #e4e1e9;
      --card-background-color: #1b1b22;
      --nav-background-color: #121218;
      --nav-border-bottom-color: transparent;
      --nav-current-border-bottom-color: transparent;
      --card-border-color: transparent;
      --up-border-left-color: transparent;
      --degraded-border-left-color: transparent;
      --down-border-left-color: transparent;
      --down-background-color: transparent;
      --tag-color: #121218;
      --tag-up-background-color: #7ddba4;
      --tag-degraded-background-color: #ffb787;
      --tag-down-background-color: #ffb4ab;
      --change-background-color: #ffb787;
      --error-button-border-color: #c3c4ff;
      --error-button-background-color: #c3c4ff;
      --error-button-color: #2b2e7b;
      --submit-button-border-color: #c3c4ff;
      --submit-button-background-color: #c3c4ff;
      --submit-button-color: #2b2e7b;

      /* The three states every reader already knows — green, amber, red — at status-page strength. */
      --ok: #3fb27f;
      --warn: #e8a33d;
      --bad: #e5534b;
      --line: #26262e;
      --muted: #a3a1ad;
    }

    body {
      font-family: "InterVariable", "Inter", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* One column, the width Discord's and Stoat's status pages read at. */
    .container {
      max-width: 820px;
    }

    /* --- navigation: the mark and the word on the left, quiet links on the right --- */
    nav {
      padding-block: 0;
    }
    nav ul li a[class] {
      border-radius: 999px;
      padding: 7px 14px;
      color: #c7c5d0;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.2;
      transition: background 200ms cubic-bezier(0.2, 0, 0, 1), color 200ms cubic-bezier(0.2, 0, 0, 1);
    }
    nav ul li a[class]:hover,
    nav ul li a[aria-current="page"][class] {
      background: #1b1b22;
      color: #e4e1e9;
    }
    .logo[class] {
      padding-block: 14px;
      gap: 10px;
    }
    .logo img[class] {
      width: 26px;
      height: 26px;
    }
    .logo div {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.01em;
      color: #e4e1e9;
    }
    a {
      color: #c3c4ff;
    }

    /* --- the heading: one line and one sentence, not an essay --- */
    header h1 {
      font-size: 30px;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 8px;
    }
    header p.lead {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      max-width: 64ch;
    }

    /* --- the banner: what everyone came for, in one filled bar ---
     * Upptime writes «✅ All systems are operational» as an article without .link; the tick is a literal
     * in the compiled component, so ::first-letter at zero size removes it and keeps the sentence. */
    article.up:not(.link) {
      background: var(--ok) !important;
      color: #fff !important;
      border-radius: 12px !important;
      padding: 18px 22px !important;
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    article.up:not(.link)::first-letter {
      font-size: 0;
    }

    /* Active incidents: the same bar, in the colour of how bad it is. */
    article.down-active[class] {
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 8px;
      background: color-mix(in srgb, var(--bad) 16%, #1b1b22);
      box-shadow: inset 3px 0 0 var(--bad);
    }
    article.down-active.degraded[class] {
      background: color-mix(in srgb, var(--warn) 14%, #1b1b22);
      box-shadow: inset 3px 0 0 var(--warn);
    }
    article.down-active h4 {
      font-weight: 650;
    }
    article.down-active div {
      color: var(--muted);
      font-size: 14px;
    }

    /* --- components: one panel, one row each — name, numbers, state on the right --- */
    section.live-status[class] {
      display: flex !important;
      flex-direction: column;
      gap: 0 !important;
      background: #1b1b22;
      border-radius: 14px;
      overflow: hidden;
      padding: 4px 0;
    }
    .live-status article[class] {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
      column-gap: 18px;
      margin: 0;
      padding: 14px 20px;
      border-radius: 0;
      border: none;
      background: transparent !important;
      background-image: none !important;
      box-shadow: none;
    }
    .live-status article + article {
      border-top: 1px solid var(--line);
    }
    .live-status article:hover {
      background: #202029 !important;
    }
    .live-status article h4[class],
    .live-status article h4 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-size: 15px;
    }
    .live-status article h4 img.icon {
      display: none;
    }
    .live-status article h4 a {
      color: #e4e1e9;
      font-weight: 600;
    }
    /* The two numbers: uptime and response time, small and grey, the labels hidden. */
    .live-status article > div {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .live-status article > div .data {
      color: #d6d4dd;
    }
    /* The state, said in words on the right — the way Discord's page says it. */
    .live-status article::after {
      justify-self: end;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }
    .live-status article.up::after {
      content: "Operational";
      color: var(--ok);
    }
    .live-status article.degraded::after {
      content: "Degraded";
      color: var(--warn);
    }
    .live-status article.down:not(.degraded)::after {
      content: "Outage";
      color: var(--bad);
    }
    /* And a dot against the name, for a glance down the list. */
    .live-status article h4::before {
      content: "";
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #6f6d78;
    }
    .live-status article.up h4::before {
      background: var(--ok);
    }
    .live-status article.degraded h4::before {
      background: var(--warn);
    }
    .live-status article.down:not(.degraded) h4::before {
      background: var(--bad);
    }

    /* The range picker above the list: small pills, not a form. */
    form.f.r label {
      border-radius: 999px;
      font-size: 13px;
    }

    /* --- incidents history --- */
    .incidents li[class],
    .incidents article[class] {
      border-radius: 12px;
      border: none;
    }
    .incidents h3[class],
    .incidents h4[class] {
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .tag[class] {
      border-radius: 999px;
      padding: 3px 10px;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0;
    }
    h2 {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Phones: name and state on one line, the numbers under the name. */
    @media (max-width: 560px) {
      .live-status article[class] {
        grid-template-columns: 1fr auto;
        row-gap: 4px;
      }
      .live-status article > div {
        grid-column: 1;
      }
      .live-status article::after {
        grid-column: 2;
        grid-row: 1;
      }
    }
